
name: multimodel-db-benchmark

services:
  arangodb:
    image: arangodb:3.12
    container_name: multimodel-arangodb
    ports:
      - "127.0.0.1:8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:?Missing password}
    volumes:
      - arangodb-data:/var/lib/arangodb3
      - arangodb-apps:/var/lib/arangodb3-apps

  surrealdb:
    image: surrealdb/surrealdb:v4.0.1
    container_name: multimodel-surrealdb
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    command: ["start", "surrealkv:/data/app.db"]
    volumes:
      - surrealdb-data:/data

  postgres:
    image: postgres:16
    container_name: multimodel-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing PostgreSQL password}
      POSTGRES_DB: multimodel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d multimodel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arangodb-data:
  arangodb-apps:
  surrealdb-data:
  postgres-data:
